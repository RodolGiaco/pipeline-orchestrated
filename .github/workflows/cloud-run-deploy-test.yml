name: Cloud Run Deploy Test

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Immutable GHCR image reference
        required: true
        type: string
        default: ghcr.io/rodolgiaco/claude-cicd-api@sha256:349e1e321169330eea7cb72ce086f2de99b04f643cba44a0dc814111d680b658

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloud Run Production
    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Validate immutable image reference
        id: image
        shell: bash
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          expected_prefix="ghcr.io/rodolgiaco/claude-cicd-api@sha256:"

          if [[ ! "$IMAGE_REF" =~ ^ghcr\.io/rodolgiaco/claude-cicd-api@sha256:[0-9a-f]{64}$ ]]; then
            printf 'ERROR: invalid immutable image reference\n' >&2
            printf 'Received: %s\n' "$IMAGE_REF" >&2
            exit 1
          fi

          digest="${IMAGE_REF##*@}"

          printf 'image_ref=%s\n' "$IMAGE_REF" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

          printf 'Validated image: %s\n' "$IMAGE_REF"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify source image metadata
        id: source
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          docker pull "$IMAGE_REF"

          source_revision="$(
            docker image inspect "$IMAGE_REF" \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
          )"

          jar_checksum="$(
            docker image inspect "$IMAGE_REF" \
              --format '{{index .Config.Labels "io.github.pipeline-orchestrated.jar.sha256"}}'
          )"

          if [[ -z "$source_revision" ]]; then
            printf 'ERROR: source revision metadata is missing\n' >&2
            exit 1
          fi

          if [[ -z "$jar_checksum" ]]; then
            printf 'ERROR: JAR checksum metadata is missing\n' >&2
            exit 1
          fi

          printf 'source_revision=%s\n' "$source_revision" >> "$GITHUB_OUTPUT"
          printf 'jar_checksum=%s\n' "$jar_checksum" >> "$GITHUB_OUTPUT"

          printf 'Source image: %s\n' "$IMAGE_REF"
          printf 'Source revision: %s\n' "$source_revision"
          printf 'JAR SHA-256: %s\n' "$jar_checksum"

      - name: Deploy immutable image to Cloud Run
        id: deploy
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          SERVICE_NAME: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE_REF" \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --min=0 \
            --max=2 \
            --concurrency=20 \
            --timeout=30s \
            --ingress=all \
            --allow-unauthenticated \
            --quiet

          service_url="$(
            gcloud run services describe "$SERVICE_NAME" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --format='value(status.url)'
          )"

          if [[ -z "$service_url" ]]; then
            printf 'ERROR: Cloud Run service URL was not resolved\n' >&2
            exit 1
          fi

          printf 'url=%s\n' "$service_url" >> "$GITHUB_OUTPUT"

          printf 'Cloud Run URL: %s\n' "$service_url"

      - name: Verify Cloud Run revision
        id: revision
        shell: bash
        env:
          SERVICE_NAME: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          revision="$(
            gcloud run services describe "$SERVICE_NAME" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --format='value(status.latestReadyRevisionName)'
          )"

          if [[ -z "$revision" ]]; then
            printf 'ERROR: latest ready revision could not be resolved\n' >&2
            exit 1
          fi

          runtime_image="$(
            gcloud run revisions describe "$revision" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --format='value(spec.containers[0].image)'
          )"

          runtime_digest="$(
            gcloud run revisions describe "$revision" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --format='value(status.imageDigest)'
          )"

          if [[ -z "$runtime_image" ]]; then
            printf 'ERROR: Cloud Run runtime image could not be resolved\n' >&2
            exit 1
          fi

          if [[ -z "$runtime_digest" ]]; then
            printf 'ERROR: Cloud Run runtime digest could not be resolved\n' >&2
            exit 1
          fi

          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
          printf 'runtime_image=%s\n' "$runtime_image" >> "$GITHUB_OUTPUT"
          printf 'runtime_digest=%s\n' "$runtime_digest" >> "$GITHUB_OUTPUT"

          printf 'Revision: %s\n' "$revision"
          printf 'Cloud Run imported image: %s\n' "$runtime_image"
          printf 'Cloud Run runtime digest: %s\n' "$runtime_digest"
          printf 'Cloud Run revision is ready.\n'

      - name: Run production smoke test
        shell: bash
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          endpoint="${SERVICE_URL}/api/v1/status"
          response=""

          for attempt in $(seq 1 30); do
            if response="$(
              curl \
                --fail \
                --silent \
                --show-error \
                "$endpoint"
            )"; then
              break
            fi

            printf 'Waiting for Cloud Run... attempt %d/30\n' "$attempt"
            sleep 2
          done

          if [[ -z "$response" ]]; then
            printf 'ERROR: Cloud Run service did not become available\n' >&2
            exit 1
          fi

          printf 'Response: %s\n' "$response"

          if ! jq -e '.status == "UP"' <<< "$response" >/dev/null; then
            printf 'ERROR: unexpected production status\n' >&2
            exit 1
          fi

          printf 'Production smoke test passed: status=UP\n'

      - name: Write deployment summary
        shell: bash
        run: |
          {
            printf '## Real Cloud Run deployment\n\n'

            printf -- '- Project: `%s`\n' \
              "${{ vars.GCP_PROJECT_ID }}"

            printf -- '- Region: `%s`\n' \
              "${{ vars.GCP_REGION }}"

            printf -- '- Service: `%s`\n' \
              "${{ vars.GCP_CLOUD_RUN_SERVICE }}"

            printf -- '- Immutable source image: `%s`\n' \
              "${{ steps.image.outputs.image_ref }}"

            printf -- '- Source revision: `%s`\n' \
              "${{ steps.source.outputs.source_revision }}"

            printf -- '- JAR SHA-256: `%s`\n' \
              "${{ steps.source.outputs.jar_checksum }}"

            printf -- '- Cloud Run revision: `%s`\n' \
              "${{ steps.revision.outputs.revision }}"

            printf -- '- Cloud Run runtime image: `%s`\n' \
              "${{ steps.revision.outputs.runtime_image }}"

            printf -- '- Cloud Run runtime digest: `%s`\n' \
              "${{ steps.revision.outputs.runtime_digest }}"

            printf -- '- Cloud Run URL: %s\n' \
              "${{ steps.deploy.outputs.url }}"

            printf -- '- Runtime identity: `%s`\n' \
              "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}"

            printf -- '- Smoke test: `GET /api/v1/status` ✓\n'
          } >> "$GITHUB_STEP_SUMMARY"