name: Release

run-name: "Release ${{ github.sha }}"

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: claude-cicd-api

jobs:
  build-release:
    name: Build Release Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run release quality gate
        shell: bash
        run: ./mvnw -B -ntp verify

      - name: Prepare release artifact
        id: release
        shell: bash
        run: |
          mkdir -p dist

          mapfile -t jars < <(
            find target \
              -maxdepth 1 \
              -type f \
              -name '*.jar' \
              -print \
              | sort
          )

          if [[ "${#jars[@]}" -ne 1 ]]; then
            printf 'ERROR: expected exactly one release JAR, found %d\n' \
              "${#jars[@]}" >&2

            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi

          release_name="claude-cicd-api-${GITHUB_SHA}.jar"
          release_path="dist/${release_name}"

          cp "${jars[0]}" "$release_path"

          sha256sum "$release_path" > "${release_path}.sha256"

          checksum="$(cut -d ' ' -f1 "${release_path}.sha256")"

          printf 'name=%s\n' "$release_name" >> "$GITHUB_OUTPUT"
          printf 'path=%s\n' "$release_path" >> "$GITHUB_OUTPUT"
          printf 'checksum=%s\n' "$checksum" >> "$GITHUB_OUTPUT"

          printf 'Release artifact: %s\n' "$release_name"
          printf 'SHA-256: %s\n' "$checksum"

      - name: Upload release artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: claude-cicd-api-${{ github.sha }}
          path: |
            ${{ steps.release.outputs.path }}
            ${{ steps.release.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.github.pipeline-orchestrated.jar.sha256=${{ steps.release.outputs.checksum }}

      - name: Build and push container image
        id: docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            JAR_FILE=${{ steps.release.outputs.path }}

      - name: Verify published image
        shell: bash
        run: |
          image_tag="${{ steps.meta.outputs.tags }}"

          docker pull "$image_tag"

          jar_checksum="$(
            docker image inspect "$image_tag" \
              --format '{{ index .Config.Labels "io.github.pipeline-orchestrated.jar.sha256" }}'
          )"

          if [[ "$jar_checksum" != "${{ steps.release.outputs.checksum }}" ]]; then
            printf 'ERROR: container JAR checksum metadata does not match release JAR\n' >&2
            exit 1
          fi

          printf 'Container JAR checksum verified: %s\n' "$jar_checksum"

      - name: Write release summary
        shell: bash
        run: |
          image_tag="${{ steps.meta.outputs.tags }}"
          image_name="${image_tag%:*}"
          image_digest="${{ steps.docker.outputs.digest }}"

          {
            printf '## Release artifact\n\n'

            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- JAR: `%s`\n' "${{ steps.release.outputs.name }}"
            printf -- '- JAR SHA-256: `%s`\n' "${{ steps.release.outputs.checksum }}"
            printf -- '- Artifact digest: `%s`\n' "${{ steps.upload.outputs.artifact-digest }}"

            printf '\n## Container image\n\n'

            printf -- '- Image: `%s`\n' "$image_tag"
            printf -- '- Image digest: `%s`\n' "$image_digest"
            printf -- '- Immutable reference: `%s@%s`\n' \
              "$image_name" "$image_digest"
          } >> "$GITHUB_STEP_SUMMARY"