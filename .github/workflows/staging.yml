name: Staging

run-name: "Staging ${{ github.event.workflow_run.head_sha }}"

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy Staging
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image
        id: image
        shell: bash
        run: |
          release_sha="${{ github.event.workflow_run.head_sha }}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"

          image_tag="ghcr.io/${owner}/claude-cicd-api:sha-${release_sha}"

          printf 'Resolving image: %s\n' "$image_tag"

          docker pull "$image_tag"

          image_ref="$(
            docker image inspect "$image_tag" \
              --format '{{index .RepoDigests 0}}'
          )"

          revision="$(
            docker image inspect "$image_tag" \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
          )"

          jar_checksum="$(
            docker image inspect "$image_tag" \
              --format '{{index .Config.Labels "io.github.pipeline-orchestrated.jar.sha256"}}'
          )"

          if [[ -z "$image_ref" ]]; then
            printf 'ERROR: image digest could not be resolved\n' >&2
            exit 1
          fi

          if [[ "$revision" != "$release_sha" ]]; then
            printf 'ERROR: image revision does not match release commit\n' >&2
            printf 'Expected: %s\n' "$release_sha" >&2
            printf 'Actual:   %s\n' "$revision" >&2
            exit 1
          fi

          if [[ -z "$jar_checksum" ]]; then
            printf 'ERROR: JAR checksum metadata is missing\n' >&2
            exit 1
          fi

          printf 'image_tag=%s\n' "$image_tag" >> "$GITHUB_OUTPUT"
          printf 'image_ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"
          printf 'release_sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"
          printf 'jar_checksum=%s\n' "$jar_checksum" >> "$GITHUB_OUTPUT"

          printf 'Immutable image: %s\n' "$image_ref"

      - name: Deploy ephemeral staging container
        id: deploy
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          container_id="$(
            docker run \
              --detach \
              --name staging-app \
              --publish 127.0.0.1:8080:8080 \
              "$IMAGE_REF"
          )"

          printf 'container_id=%s\n' "$container_id" >> "$GITHUB_OUTPUT"
          printf 'Staging container: %s\n' "$container_id"

      - name: Run staging smoke test
        shell: bash
        run: |
          endpoint="http://127.0.0.1:8080/api/v1/status"
          response=""

          for attempt in $(seq 1 30); do
            if response="$(curl --fail --silent --show-error "$endpoint")"; then
              break
            fi

            printf 'Waiting for application... attempt %d/30\n' "$attempt"
            sleep 2
          done

          if [[ -z "$response" ]]; then
            printf 'ERROR: staging application did not become ready\n' >&2
            docker logs staging-app >&2
            exit 1
          fi

          printf 'Response: %s\n' "$response"

          if ! jq -e '.status == "UP"' <<< "$response" >/dev/null; then
            printf 'ERROR: smoke test returned unexpected status\n' >&2
            exit 1
          fi

          printf 'Smoke test passed: status=UP\n'

      - name: Write staging summary
        shell: bash
        run: |
          {
            printf '## Staging deployment\n\n'
            printf -- '- Release commit: `%s`\n' \
              "${{ steps.image.outputs.release_sha }}"
            printf -- '- Image tag: `%s`\n' \
              "${{ steps.image.outputs.image_tag }}"
            printf -- '- Immutable image: `%s`\n' \
              "${{ steps.image.outputs.image_ref }}"
            printf -- '- JAR SHA-256: `%s`\n' \
              "${{ steps.image.outputs.jar_checksum }}"
            printf -- '- Smoke test: `GET /api/v1/status` ✓\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show container logs on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          docker logs staging-app || true

      - name: Remove staging container
        if: ${{ always() }}
        shell: bash
        run: |
          docker rm --force staging-app >/dev/null 2>&1 || true