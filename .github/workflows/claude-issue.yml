name: Claude Issue

run-name: "Claude issue #${{ github.event.issue.number }}"

on:
  issues:
    types:
      - labeled

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: claude-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude-issue:
    if: github.event.label.name == 'claude:ready'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Mark issue as in progress
        id: state_start
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"

          current_labels="$(
            gh issue view "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --json labels \
              --jq '.labels[].name'
          )"

          args=(
            --repo "$GITHUB_REPOSITORY"
            --remove-label "claude:ready"
            --add-label "claude:in-progress"
          )

          if grep -Fxq "claude:blocked" <<< "$current_labels"; then
            args+=(--remove-label "claude:blocked")
          fi

          gh issue edit "$issue_number" "${args[@]}"

          printf 'started=true\n' >> "$GITHUB_OUTPUT"

      - name: Create isolated issue branch
        shell: bash
        run: |
          issue_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          branch_name="claude/issue-${issue_number}"

          if git show-ref --verify --quiet "refs/remotes/origin/$branch_name"; then
            printf 'ERROR: remote branch already exists: %s\n' "$branch_name" >&2
            exit 40
          fi

          git switch -c "$branch_name"

          printf 'Working branch: %s\n' "$branch_name"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Claude Code
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.259
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      - name: Trust workspace for Claude Code
        shell: bash
        run: |
          jq -n \
            --arg workspace "$GITHUB_WORKSPACE" \
            '{
              projects: {
                ($workspace): {
                  hasTrustDialogAccepted: true
                }
              }
            }' > "$HOME/.claude.json"

      - name: Build implementation prompt
        shell: bash
        run: |
          issue_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          issue_title="$(jq -r '.issue.title' "$GITHUB_EVENT_PATH")"
          issue_body="$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"

          {
            printf 'Implement the following GitHub issue.\n\n'

            printf 'Respect CLAUDE.md and all project permissions and hooks.\n'
            printf 'Do not run Git commands.\n'
            printf 'Modify only the files necessary to complete the task.\n'
            printf 'You may run project-approved Maven Wrapper commands when useful.\n\n'

            printf 'Issue #%s\n\n' "$issue_number"

            printf 'Title:\n%s\n\n' "$issue_title"

            printf 'Body:\n%s\n\n' "$issue_body"

            printf 'Implement the requested change and satisfy the acceptance criteria.\n'
            printf 'If the task is completed, report status completed.\n'
            printf 'List every modified file in modifiedFiles.\n'
            printf 'List only commands actually executed in testsRun.\n'
            printf 'If the task cannot be completed under the project policies, report status blocked and explain why.\n'
          } > /tmp/task-prompt.txt

      - name: Run Claude issue task
        id: task
        shell: bash
        env:
          USE_OPENROUTER: ${{ vars.USE_OPENROUTER }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e

          if [[ "${USE_OPENROUTER:-false}" == "true" ]]; then
            printf 'INFO: Using OpenRouter free model\n'

            cat /tmp/task-prompt.txt \
              | env \
                  -u CLAUDE_CODE_OAUTH_TOKEN \
                  ANTHROPIC_BASE_URL="https://openrouter.ai/api" \
                  ANTHROPIC_AUTH_TOKEN="$OPENROUTER_API_KEY" \
                  ANTHROPIC_API_KEY="" \
                  OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
                  CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY=1 \
                  CLAUDE_CODE_SKIP_FAST_MODE_ORG_CHECK=1 \
                  CLAUDE_CODE_SIMPLE_SYSTEM_PROMPT=1 \
                  CLAUDE_MODEL="openrouter/free" \
                  scripts/ci/run-task.sh \
              | tee /tmp/task-result.json

            task_exit_code=${PIPESTATUS[1]}
          else
            printf 'INFO: Using Claude default model\n'

            cat /tmp/task-prompt.txt \
              | env \
                  -u ANTHROPIC_BASE_URL \
                  -u ANTHROPIC_AUTH_TOKEN \
                  -u ANTHROPIC_API_KEY \
                  -u OPENROUTER_API_KEY \
                  -u CLAUDE_MODEL \
                  -u CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY \
                  -u CLAUDE_CODE_SKIP_FAST_MODE_ORG_CHECK \
                  -u CLAUDE_CODE_SIMPLE_SYSTEM_PROMPT \
                  CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN" \
                  scripts/ci/run-task.sh \
              | tee /tmp/task-result.json

            task_exit_code=${PIPESTATUS[1]}
          fi

          set -e

          printf 'Pipeline exit code: %d\n' "$task_exit_code"
          printf 'exit_code=%d\n' "$task_exit_code" >> "$GITHUB_OUTPUT"

      - name: Stop blocked workflow
        if: ${{ steps.task.outputs.exit_code != '0' }}
        shell: bash
        env:
          TASK_EXIT_CODE: ${{ steps.task.outputs.exit_code }}
        run: |
          exit "$TASK_EXIT_CODE"

      - name: Validate implementation changes
        id: changes
        if: ${{ steps.task.outputs.exit_code == '0' }}
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- src pom.xml)" ]]; then
            printf 'has_changes=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'has_changes=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Mark empty implementation as blocked
        if: ${{ steps.task.outputs.exit_code == '0' && steps.changes.outputs.has_changes == 'false' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"

          gh issue edit "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "claude:in-progress" \
            --add-label "claude:blocked"

          gh issue comment "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Automation moved this issue to \`claude:blocked\`.

          Reason: Claude Code reported the task as completed but produced no publishable implementation changes."

      - name: Stop empty implementation
        if: ${{ steps.task.outputs.exit_code == '0' && steps.changes.outputs.has_changes == 'false' }}
        shell: bash
        run: |
          exit 10

      - name: Inspect implementation
        if: ${{ steps.task.outputs.exit_code == '0' && steps.changes.outputs.has_changes == 'true' }}
        shell: bash
        run: |
          printf '%s\n' '--- Git status ---'
          git status --short

          printf '%s\n' '--- Diff stat ---'
          git diff --stat

          printf '%s\n' '--- Diff check ---'
          git diff --check

      - name: Commit and push approved implementation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          branch_name="claude/issue-${issue_number}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- src pom.xml

          if git diff --cached --quiet; then
            printf 'ERROR: no implementation changes to publish\n' >&2
            exit 40
          fi

          git diff --cached --check

          git commit -m "chore: implement issue #${issue_number}"

          gh auth setup-git

          git push --set-upstream origin "$branch_name"

      - name: Create pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          issue_title="$(jq -r '.issue.title' "$GITHUB_EVENT_PATH")"
          default_branch="$(jq -r '.repository.default_branch' "$GITHUB_EVENT_PATH")"
          branch_name="claude/issue-${issue_number}"

          cat > /tmp/pr-body.md <<EOF
          Automated implementation for #${issue_number}.

          Closes #${issue_number}

          Validation:
          - \`./mvnw -B -ntp verify\` passed.

          Claude Code produced the implementation.
          GitHub Actions performed the commit, push, and pull request publication.
          EOF

          pr_url="$(
            gh pr create \
              --base "$default_branch" \
              --head "$branch_name" \
              --title "$issue_title" \
              --body-file /tmp/pr-body.md
          )"

          pr_number="${pr_url##*/}"

          printf 'url=%s\n' "$pr_url" >> "$GITHUB_OUTPUT"
          printf 'number=%s\n' "$pr_number" >> "$GITHUB_OUTPUT"

          printf 'Pull request: %s\n' "$pr_url"
          printf 'Pull request: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Mark issue as pull request open
        id: state_pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          issue_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"

          gh issue edit "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "claude:in-progress" \
            --add-label "claude:pr-open"

          gh issue comment "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Implementation published in PR #${PR_NUMBER}."

      - name: Mark setup failure as blocked
        if: ${{ failure() && steps.state_start.outputs.started == 'true' && steps.task.outputs.exit_code == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"

          gh issue edit "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "claude:in-progress" \
            --add-label "claude:blocked"

          gh issue comment "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Automation failed before the Claude task could be executed."

      - name: Mark publication failure as blocked
        if: ${{ failure() && steps.task.outputs.exit_code == '0' && steps.changes.outputs.has_changes == 'true' && steps.state_pr.outcome != 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"

          gh issue edit "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "claude:in-progress" \
            --add-label "claude:blocked"

          gh issue comment "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --body "The implementation passed validation, but the publication stage failed."