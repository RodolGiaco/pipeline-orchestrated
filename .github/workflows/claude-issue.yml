name: Claude Issue

run-name: "Claude issue #${{ github.event.issue.number }}"

on:
  issues:
    types:
      - labeled

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: claude-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude-issue:
    if: ${{ github.event.label.name == 'claude:ready' || github.event.label.name == 'claude:retry' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Mark issue as in progress
        id: state_start
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          trigger_label="$(jq -r '.label.name' "$GITHUB_EVENT_PATH")"
          
          current_labels="$(
            gh issue view "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --json labels \
              --jq '.labels[].name'
          )"
          
          if [[ "$trigger_label" == "claude:retry" ]] \
              && ! grep -Fxq "claude:blocked" <<< "$current_labels"; then
            printf 'ERROR: claude:retry is only valid from claude:blocked\n' >&2
            exit 41
          fi
          
          published_recovery=false
          
          if [[ "$trigger_label" == "claude:retry" ]] \
              && grep -Fxq "claude:published" <<< "$current_labels"; then
            published_recovery=true
          fi
          
          args=(
            --repo "$GITHUB_REPOSITORY"
            --remove-label "$trigger_label"
            --add-label "claude:in-progress"
          )
          
          if grep -Fxq "claude:blocked" <<< "$current_labels"; then
            args+=(--remove-label "claude:blocked")
          fi
          
          gh issue edit "$issue_number" "${args[@]}"
          
          printf 'started=true\n' >> "$GITHUB_OUTPUT"
          printf 'published_recovery=%s\n' "$published_recovery" >> "$GITHUB_OUTPUT"
          
          printf 'Published recovery: %s\n' "$published_recovery"

      - name: Create or recover isolated issue branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_RECOVERY: ${{ steps.state_start.outputs.published_recovery }}
        run: |
          issue_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          branch_name="claude/issue-${issue_number}"
          encoded_branch="$(jq -rn --arg value "$branch_name" '$value | @uri')"

          set +e

          http_status="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/$encoded_branch"
          )"

          curl_exit_code=$?

          set -e

          if [[ "$curl_exit_code" -ne 0 ]]; then
            printf 'ERROR: could not query remote branch state\n' >&2
            exit 43
          fi

          case "$http_status" in
            200)
              remote_branch_exists=true
              ;;
            404)
              remote_branch_exists=false
              ;;
            *)
              printf 'ERROR: GitHub API returned HTTP %s while checking branch %s\n' \
                "$http_status" "$branch_name" >&2
              exit 43
              ;;
          esac

          if [[ "$PUBLISHED_RECOVERY" == "true" ]]; then
            if [[ "$remote_branch_exists" != "true" ]]; then
              printf 'ERROR: claude:published exists but remote branch is missing: %s\n' \
                "$branch_name" >&2
              exit 42
            fi

            printf 'Recovering published branch: %s\n' "$branch_name"

            gh auth setup-git

            git fetch origin \
              "$branch_name:refs/remotes/origin/$branch_name"

            git switch -C "$branch_name" "origin/$branch_name"
          else
            if [[ "$remote_branch_exists" == "true" ]]; then
              printf 'ERROR: remote branch exists without claude:published: %s\n' \
                "$branch_name" >&2
              exit 42
            fi

            printf 'Creating new issue branch: %s\n' "$branch_name"

            git switch -c "$branch_name"
          fi

          printf 'Working branch: %s\n' "$branch_name"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Claude Code
        if: steps.state_start.outputs.published_recovery != 'true'
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.259
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      - name: Trust workspace for Claude Code
        if: steps.state_start.outputs.published_recovery != 'true'
        shell: bash
        run: |
          jq -n \
            --arg workspace "$GITHUB_WORKSPACE" \
            '{
              projects: {
                ($workspace): {
                  hasTrustDialogAccepted: true
                }
              }
            }' > "$HOME/.claude.json"

      - name: Build implementation prompt
        if: steps.state_start.outputs.published_recovery != 'true'
        shell: bash
        run: |
          issue_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          issue_title="$(jq -r '.issue.title' "$GITHUB_EVENT_PATH")"
          issue_body="$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"

          {
            printf 'Implement the following GitHub issue.\n\n'

            printf 'Respect CLAUDE.md and all project permissions and hooks.\n'
            printf 'Do not run Git commands.\n'
            printf 'Modify only the files necessary to complete the task.\n'
            printf 'You may run project-approved Maven Wrapper commands when useful.\n\n'

            printf 'Issue #%s\n\n' "$issue_number"

            printf 'Title:\n%s\n\n' "$issue_title"

            printf 'Body:\n%s\n\n' "$issue_body"

            printf 'Implement the requested change and satisfy the acceptance criteria.\n'
            printf 'If the task is completed, report status completed.\n'
            printf 'List every modified file in modifiedFiles.\n'
            printf 'List only commands actually executed in testsRun.\n'
            printf 'If the task cannot be completed under the project policies, report status blocked and explain why.\n'
          } > /tmp/task-prompt.txt

      - name: Run Claude issue task
        if: steps.state_start.outputs.published_recovery != 'true'
        id: task
        shell: bash
        env:
          USE_OPENROUTER: ${{ vars.USE_OPENROUTER }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e

          if [[ "${USE_OPENROUTER:-false}" == "true" ]]; then
            printf 'INFO: Using OpenRouter free model\n'

            cat /tmp/task-prompt.txt \
              | env \
                  -u CLAUDE_CODE_OAUTH_TOKEN \
                  ANTHROPIC_BASE_URL="https://openrouter.ai/api" \
                  ANTHROPIC_AUTH_TOKEN="$OPENROUTER_API_KEY" \
                  ANTHROPIC_API_KEY="" \
                  OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
                  CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY=1 \
                  CLAUDE_CODE_SKIP_FAST_MODE_ORG_CHECK=1 \
                  CLAUDE_CODE_SIMPLE_SYSTEM_PROMPT=1 \
                  CLAUDE_MODEL="openrouter/free" \
                  scripts/ci/run-task.sh \
              | tee /tmp/task-result.json

            task_exit_code=${PIPESTATUS[1]}
          else
            printf 'INFO: Using Claude default model\n'

            cat /tmp/task-prompt.txt \
              | env \
                  -u ANTHROPIC_BASE_URL \
                  -u ANTHROPIC_AUTH_TOKEN \
                  -u ANTHROPIC_API_KEY \
                  -u OPENROUTER_API_KEY \
                  -u CLAUDE_MODEL \
                  -u CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY \
                  -u CLAUDE_CODE_SKIP_FAST_MODE_ORG_CHECK \
                  -u CLAUDE_CODE_SIMPLE_SYSTEM_PROMPT \
                  CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN" \
                  scripts/ci/run-task.sh \
              | tee /tmp/task-result.json

            task_exit_code=${PIPESTATUS[1]}
          fi

          set -e

          printf 'Pipeline exit code: %d\n' "$task_exit_code"
          printf 'exit_code=%d\n' "$task_exit_code" >> "$GITHUB_OUTPUT"

      - name: Validate recovered implementation
        id: recovery_gate
        if: steps.state_start.outputs.published_recovery == 'true'
        shell: bash
        run: |
          ./mvnw -B -ntp verify

      - name: Mark issue as blocked
        if: ${{ steps.state_start.outputs.published_recovery != 'true' && steps.task.outputs.exit_code != '' && steps.task.outputs.exit_code != '0' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_EXIT_CODE: ${{ steps.task.outputs.exit_code }}
        run: |
          issue_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"

          case "$TASK_EXIT_CODE" in
            10)
              reason="Claude Code could not complete the task under the current project policies."

              if jq -e . /tmp/task-result.json >/dev/null 2>&1; then
                reported_reason="$(
                  jq -r '.agent.taskResult.blockingReason // empty' \
                    /tmp/task-result.json
                )"

                if [[ -n "$reported_reason" ]]; then
                  reason="$reported_reason"
                fi
              fi
              ;;
            20)
              reason="Claude Code or the agent wrapper failed before producing a valid completed result."
              ;;
            30)
              reason="The external quality gate failed after Claude Code completed its work."
              ;;
            *)
              reason="The pipeline failed with unexpected exit code ${TASK_EXIT_CODE}."
              ;;
          esac

          gh issue edit "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "claude:in-progress" \
            --add-label "claude:blocked"

          gh issue comment "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Automation moved this issue to \`claude:blocked\`.

          Reason: ${reason}"

      - name: Stop blocked workflow
        if: ${{ steps.state_start.outputs.published_recovery != 'true' && steps.task.outputs.exit_code != '' && steps.task.outputs.exit_code != '0' }}
        shell: bash
        env:
          TASK_EXIT_CODE: ${{ steps.task.outputs.exit_code }}
        run: |
          exit "$TASK_EXIT_CODE"

      - name: Validate implementation changes
        id: changes
        if: ${{ steps.state_start.outputs.published_recovery != 'true' && steps.task.outputs.exit_code != '' && steps.task.outputs.exit_code == '0' }}
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- src pom.xml)" ]]; then
            printf 'has_changes=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'has_changes=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Mark empty implementation as blocked
        if: ${{ steps.state_start.outputs.published_recovery != 'true' && steps.task.outputs.exit_code != '' && steps.task.outputs.exit_code == '0' && steps.changes.outputs.has_changes == 'false' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"

          gh issue edit "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "claude:in-progress" \
            --add-label "claude:blocked"

          gh issue comment "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Automation moved this issue to \`claude:blocked\`.

          Reason: Claude Code reported the task as completed but produced no publishable implementation changes."

      - name: Stop empty implementation
        if: ${{ steps.state_start.outputs.published_recovery != 'true' && steps.task.outputs.exit_code != '' && steps.task.outputs.exit_code == '0' && steps.changes.outputs.has_changes == 'false' }}
        shell: bash
        run: |
          exit 10

      - name: Inspect implementation
        if: steps.state_start.outputs.published_recovery != 'true'
        shell: bash
        run: |
          printf '%s\n' '--- Git status ---'
          git status --short

          printf '%s\n' '--- Diff stat ---'
          git diff --stat

          printf '%s\n' '--- Diff check ---'
          git diff --check

      - name: Commit and push approved implementation
        if: steps.state_start.outputs.published_recovery != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          branch_name="claude/issue-${issue_number}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- src pom.xml

          if git diff --cached --quiet; then
            printf 'ERROR: no implementation changes to publish\n' >&2
            exit 40
          fi

          git diff --cached --check

          git commit -m "chore: implement issue #${issue_number}"

          encoded_branch="$(jq -rn --arg value "$branch_name" '$value | @uri')"

          set +e

          http_status="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/$encoded_branch"
          )"

          curl_exit_code=$?

          set -e

          if [[ "$curl_exit_code" -ne 0 ]]; then
            printf 'ERROR: could not query remote branch state before push\n' >&2
            exit 43
          fi

          case "$http_status" in
            404)
              ;;
            200)
              printf 'ERROR: remote branch appeared unexpectedly: %s\n' \
                "$branch_name" >&2
              exit 42
              ;;
            *)
              printf 'ERROR: GitHub API returned HTTP %s while checking branch %s\n' \
                "$http_status" "$branch_name" >&2
              exit 43
              ;;
          esac

          gh auth setup-git

          git push --set-upstream origin "$branch_name"

      - name: Mark implementation as published
        id: state_published
        if: steps.state_start.outputs.published_recovery != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"

          gh issue edit "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --add-label "claude:published"

          printf 'published=true\n' >> "$GITHUB_OUTPUT"

      - name: Create or recover pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          issue_title="$(jq -r '.issue.title' "$GITHUB_EVENT_PATH")"
          default_branch="$(jq -r '.repository.default_branch' "$GITHUB_EVENT_PATH")"
          branch_name="claude/issue-${issue_number}"

          existing_pr="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$branch_name" \
              --state open \
              --json number,url \
              --jq '.[0] // empty'
          )"

          if [[ -n "$existing_pr" ]]; then
            pr_number="$(jq -r '.number' <<< "$existing_pr")"
            pr_url="$(jq -r '.url' <<< "$existing_pr")"

            printf 'Reusing existing pull request: %s\n' "$pr_url"
          else
            cat > /tmp/pr-body.md <<EOF
          Automated implementation for #${issue_number}.

          Closes #${issue_number}

          Validation:
          - \`./mvnw -B -ntp verify\` passed.

          Claude Code produced the implementation.
          GitHub Actions performed the commit, push, and pull request publication.
          EOF
            pr_url="$(
              gh pr create \
                --base "$default_branch" \
                --head "$branch_name" \
                --title "$issue_title" \
                --body-file /tmp/pr-body.md
            )"

            pr_number="${pr_url##*/}"
          fi

          printf 'url=%s\n' "$pr_url" >> "$GITHUB_OUTPUT"
          printf 'number=%s\n' "$pr_number" >> "$GITHUB_OUTPUT"

          printf 'Pull request: %s\n' "$pr_url"
          printf 'Pull request: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Mark issue as pull request open
        id: state_pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          issue_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"

          gh issue edit "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "claude:in-progress" \
            --remove-label "claude:published" \
            --add-label "claude:pr-open"

          gh issue comment "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Implementation published in PR #${PR_NUMBER}."

      - name: Mark unexpected failure as blocked
        if: ${{ failure() && steps.state_start.outputs.started == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          
          current_labels="$(
            gh issue view "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --json labels \
              --jq '.labels[].name'
          )"
          
          if grep -Fxq "claude:blocked" <<< "$current_labels"; then
            exit 0
          fi
          
          gh issue edit "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "claude:in-progress" \
            --add-label "claude:blocked"
          
          gh issue comment "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Automation failed. Review the associated GitHub Actions run before retrying."