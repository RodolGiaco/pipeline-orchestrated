spring.application.name=cicd-api

# Injected by Maven resource filtering at build time.
build.version=@project.version@

# Set per environment by the deployment workflows; defaults to local execution.
app.environment=${APP_ENVIRONMENT:local}

# Report request validation failures using the standard RFC 7807 problem detail
# representation instead of leaking internal exception details.
spring.mvc.problemdetails.enabled=true
